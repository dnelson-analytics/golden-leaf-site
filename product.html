<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="robots" content="noindex, nofollow">
  <title>Golden Leaf Products (prototype)</title>
  <script>
    // Old query-string links forward to the static pages: product.html?p=ID -> p/ID/

  </script>
</head>
<body>
  <p><a href="index.html">Golden Leaf Products home</a></p>
</body>
